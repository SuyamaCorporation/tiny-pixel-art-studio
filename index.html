<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイニーピクセルアートスタジオ</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Hiragino Kana', 'Noto Sans JP', sans-serif; background:#1a1a2e; color:#e2e8f0; }
  #canvas-wrap { display:inline-block; cursor:crosshair; user-select:none; }
  #pixel-canvas { display:block; image-rendering:pixelated; }
  .tool-btn { width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; transition:all 0.15s; border:2px solid transparent; cursor:pointer; background:#2d3748; }
  .tool-btn:hover { background:#4a5568; }
  .tool-btn.active { background:#3182ce; border-color:#63b3ed; }
  .tool-btn:focus { outline:3px solid #63b3ed; outline-offset:2px; }
  .color-swatch { width:22px; height:22px; border-radius:4px; border:2px solid #4a5568; cursor:pointer; flex-shrink:0; transition:transform 0.1s; }
  .color-swatch:hover, .color-swatch:focus { transform:scale(1.3); border-color:#63b3ed; outline:none; }
  .color-swatch.selected { border-color:#63b3ed; transform:scale(1.3); box-shadow:0 0 0 2px #63b3ed; }
  .frame-thumb { width:40px; height:40px; border:2px solid #4a5568; cursor:pointer; image-rendering:pixelated; border-radius:4px; }
  .frame-thumb.active { border-color:#63b3ed; }
  .panel { background:#2d3748; border-radius:12px; padding:10px; }
  .btn-sm { padding:4px 10px; border-radius:6px; font-size:0.75rem; font-weight:600; cursor:pointer; transition:all 0.15s; }
  .btn-sm:focus { outline:3px solid #63b3ed; outline-offset:2px; }
  #anim-preview-canvas { image-rendering:pixelated; border:2px solid #4a5568; border-radius:4px; }
  label { font-size:0.75rem; color:#a0aec0; }
  .section-title { font-size:0.7rem; font-weight:700; color:#718096; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
</style>
</head>
<body class="min-h-screen">

<div class="max-w-screen-xl mx-auto p-2">

  <!-- Header -->
  <div class="flex items-center justify-between mb-2">
    <h1 class="text-base font-bold text-blue-300">🎨 タイニーピクセルアートスタジオ</h1>
    <div class="flex gap-2 items-center">
      <label for="grid-size-select" class="sr-only">グリッドサイズ</label>
      <select id="grid-size-select" class="bg-gray-700 text-white text-xs rounded px-2 py-1 border border-gray-600">
        <option value="16">16×16</option>
        <option value="32">32×32</option>
      </select>
      <label for="zoom-select" class="sr-only">ズーム</label>
      <select id="zoom-select" class="bg-gray-700 text-white text-xs rounded px-2 py-1 border border-gray-600">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="4" selected>4x</option>
      </select>
    </div>
  </div>

  <div class="flex gap-2 flex-wrap lg:flex-nowrap">

    <!-- Left: Tools + Colors -->
    <div class="flex flex-col gap-2 w-full lg:w-48 flex-shrink-0">

      <!-- Tools -->
      <div class="panel">
        <div class="section-title">ツール</div>
        <div class="flex flex-wrap gap-1" role="toolbar" aria-label="描画ツール">
          <button class="tool-btn active" id="tool-pen" title="ペン" aria-pressed="true" aria-label="ペン">✏️</button>
          <button class="tool-btn" id="tool-eraser" title="消しゴム" aria-pressed="false" aria-label="消しゴム">🧹</button>
          <button class="tool-btn" id="tool-fill" title="バケツ塗り" aria-pressed="false" aria-label="バケツ">🪣</button>
          <button class="tool-btn" id="tool-eyedropper" title="スポイト" aria-pressed="false" aria-label="スポイト">👁️</button>
          <button class="tool-btn" id="tool-line" title="ライン" aria-pressed="false" aria-label="ライン">📐</button>
        </div>
      </div>

      <!-- Current Color -->
      <div class="panel">
        <div class="section-title">現在の色</div>
        <div class="flex items-center gap-2 mb-2">
          <div id="current-color-display" style="width:36px;height:36px;border-radius:6px;border:2px solid #4a5568;background:#000000;"></div>
          <input type="color" id="color-picker-input" value="#000000" class="bg-gray-700 border border-gray-600 rounded cursor-pointer" style="width:36px;height:36px;padding:0;" aria-label="カスタムカラー">
        </div>
        <div class="section-title">パレット（32色）</div>
        <div id="palette" class="flex flex-wrap gap-1" role="list" aria-label="カラーパレット"></div>
      </div>

      <!-- Undo/Redo -->
      <div class="panel">
        <div class="section-title">編集</div>
        <div class="flex gap-1">
          <button id="btn-undo" class="btn-sm bg-gray-600 hover:bg-gray-500 text-white flex-1" aria-label="元に戻す">↩ 元に戻す</button>
          <button id="btn-redo" class="btn-sm bg-gray-600 hover:bg-gray-500 text-white flex-1" aria-label="やり直し">↪ やり直し</button>
        </div>
        <div class="flex gap-1 mt-1">
          <button id="btn-clear" class="btn-sm bg-red-800 hover:bg-red-700 text-white flex-1">🗑 クリア</button>
          <button id="btn-grid-toggle" class="btn-sm bg-gray-600 hover:bg-gray-500 text-white flex-1">グリッド</button>
        </div>
      </div>

      <!-- Save/Load -->
      <div class="panel">
        <div class="section-title">保存・読込</div>
        <label for="slot-select" class="sr-only">スロット選択</label>
        <select id="slot-select" class="bg-gray-700 text-white text-xs rounded px-2 py-1 border border-gray-600 w-full mb-1">
          <option value="0">スロット 1</option>
          <option value="1">スロット 2</option>
          <option value="2">スロット 3</option>
          <option value="3">スロット 4</option>
          <option value="4">スロット 5</option>
        </select>
        <div class="flex gap-1">
          <button id="btn-save" class="btn-sm bg-blue-700 hover:bg-blue-600 text-white flex-1">💾 保存</button>
          <button id="btn-load" class="btn-sm bg-green-700 hover:bg-green-600 text-white flex-1">📂 読込</button>
        </div>
        <div id="slot-status" class="text-xs text-gray-400 mt-1 text-center"></div>
      </div>

      <!-- Export -->
      <div class="panel">
        <div class="section-title">エクスポート</div>
        <button id="btn-export-png" class="btn-sm bg-purple-700 hover:bg-purple-600 text-white w-full">📥 PNG保存</button>
      </div>

    </div>

    <!-- Center: Canvas -->
    <div class="flex flex-col items-center gap-2 flex-1">
      <div class="panel" style="overflow:auto;max-width:100%;">
        <div id="canvas-wrap" aria-label="ピクセルアートキャンバス" role="img">
          <canvas id="pixel-canvas" aria-label="描画キャンバス"></canvas>
        </div>
      </div>
    </div>

    <!-- Right: Animation -->
    <div class="flex flex-col gap-2 w-full lg:w-44 flex-shrink-0">

      <div class="panel">
        <div class="section-title">アニメーション</div>
        <div id="frame-strip" class="flex flex-wrap gap-1 mb-2 max-h-48 overflow-y-auto" role="list" aria-label="フレーム一覧"></div>
        <div class="flex gap-1">
          <button id="btn-add-frame" class="btn-sm bg-blue-700 hover:bg-blue-600 text-white flex-1">+ 追加</button>
          <button id="btn-del-frame" class="btn-sm bg-red-800 hover:bg-red-700 text-white flex-1">- 削除</button>
        </div>
        <div class="mt-2">
          <label for="fps-input">FPS: <span id="fps-label">4</span></label>
          <input type="range" id="fps-input" min="1" max="24" value="4" class="w-full accent-blue-400 mt-1">
        </div>
        <div class="flex gap-1 mt-2">
          <button id="btn-play" class="btn-sm bg-green-700 hover:bg-green-600 text-white flex-1">▶ 再生</button>
          <button id="btn-stop" class="btn-sm bg-gray-600 hover:bg-gray-500 text-white flex-1">■ 停止</button>
        </div>
      </div>

      <!-- Preview -->
      <div class="panel text-center">
        <div class="section-title">プレビュー</div>
        <canvas id="anim-preview-canvas" width="64" height="64" aria-label="アニメーションプレビュー"></canvas>
        <div id="anim-frame-label" class="text-xs text-gray-400 mt-1"></div>
      </div>

    </div>
  </div>
</div>

<script>
// ---- Constants ----
const PALETTE = [
  '#000000','#ffffff','#ff0000','#00ff00','#0000ff','#ffff00','#ff00ff','#00ffff',
  '#ff8800','#8800ff','#00ff88','#ff0088','#88ff00','#0088ff','#ff4444','#44ff44',
  '#4444ff','#ffaa00','#aa00ff','#00ffaa','#ff00aa','#aaffoo','#00aaff','#884400',
  '#448800','#004488','#884488','#448844','#448888','#888844','#cc6600','#666666',
];

const MAX_UNDO = 20;
const MAX_SLOTS = 5;

// ---- State ----
let gridSize = 16;
let cellSize = 20; // pixels per cell on screen (zoom 4x on 16x16, recalc on change)
let currentTool = 'pen';
let currentColor = '#000000';
let showGrid = true;

let frames = []; // Array of Uint32Array (ARGB)
let currentFrame = 0;
let undoStack = [];
let redoStack = [];
let animTimer = null;
let animFrameIdx = 0;
let fps = 4;
let isDrawing = false;
let lineStart = null;
let previewPixels = null; // for line preview

function makeBlankFrame() {
  return new Uint32Array(gridSize * gridSize); // 0 = transparent
}

function colorToUint32(hex) {
  if (!hex || hex === 'transparent') return 0;
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return 0xFF000000 | (r << 16) | (g << 8) | b;
}

function uint32ToHex(val) {
  if (val === 0) return 'transparent';
  const r = (val >> 16) & 0xFF;
  const g = (val >> 8) & 0xFF;
  const b = val & 0xFF;
  return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

// ---- Canvas setup ----
const canvas = document.getElementById('pixel-canvas');
const ctx = canvas.getContext('2d');

function recalcCellSize() {
  const zoom = parseInt(document.getElementById('zoom-select').value);
  cellSize = zoom * (gridSize === 16 ? 20 : 10);
  canvas.width = gridSize * cellSize;
  canvas.height = gridSize * cellSize;
}

function initApp() {
  recalcCellSize();
  if (frames.length === 0) frames = [makeBlankFrame()];
  currentFrame = 0;
  renderCanvas();
  renderFrameStrip();
  renderPalette();
  updateCurrentColorDisplay();
  updatePreview();
}

// ---- Render ----
function renderCanvas(overlay) {
  const frame = frames[currentFrame];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Checkerboard for transparency
  for (let y=0; y<gridSize; y++) {
    for (let x=0; x<gridSize; x++) {
      const checker = (x+y)%2===0 ? '#d0d0d0' : '#b0b0b0';
      ctx.fillStyle = checker;
      ctx.fillRect(x*cellSize, y*cellSize, cellSize, cellSize);
      const col = overlay ? overlay[y*gridSize+x] : frame[y*gridSize+x];
      if (col) {
        ctx.fillStyle = uint32ToHex(col);
        ctx.fillRect(x*cellSize, y*cellSize, cellSize, cellSize);
      }
    }
  }
  if (showGrid) {
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 0.5;
    for (let x=0; x<=gridSize; x++) {
      ctx.beginPath();
      ctx.moveTo(x*cellSize, 0);
      ctx.lineTo(x*cellSize, gridSize*cellSize);
      ctx.stroke();
    }
    for (let y=0; y<=gridSize; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y*cellSize);
      ctx.lineTo(gridSize*cellSize, y*cellSize);
      ctx.stroke();
    }
  }
}

function renderFrameStrip() {
  const strip = document.getElementById('frame-strip');
  strip.innerHTML = '';
  frames.forEach((frame, i) => {
    const c = document.createElement('canvas');
    c.width = gridSize;
    c.height = gridSize;
    c.className = 'frame-thumb' + (i===currentFrame?' active':'');
    c.setAttribute('role','listitem');
    c.setAttribute('aria-label', 'フレーム'+(i+1));
    c.setAttribute('tabindex','0');
    c.style.width = '40px';
    c.style.height = '40px';
    const tc = c.getContext('2d');
    renderFrameToCtx(tc, frame, gridSize);
    c.addEventListener('click', ()=>selectFrame(i));
    c.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') selectFrame(i); });
    strip.appendChild(c);
    // Label
    const lbl = document.createElement('div');
    lbl.className = 'text-xs text-center text-gray-400';
    lbl.textContent = i+1;
    // wrap in div
    const wrap = document.createElement('div');
    wrap.className = 'flex flex-col items-center';
    wrap.appendChild(c);
    wrap.appendChild(lbl);
    strip.appendChild(wrap);
  });
  document.getElementById('anim-frame-label').textContent = 'フレーム ' + (currentFrame+1) + '/' + frames.length;
}

function renderFrameToCtx(tc, frame, size) {
  for (let y=0; y<size; y++) {
    for (let x=0; x<size; x++) {
      const col = frame[y*size+x];
      if (col) {
        tc.fillStyle = uint32ToHex(col);
        tc.fillRect(x,y,1,1);
      }
    }
  }
}

function renderPalette() {
  const palette = document.getElementById('palette');
  palette.innerHTML = '';
  PALETTE.forEach((col, i) => {
    const btn = document.createElement('button');
    btn.className = 'color-swatch' + (col===currentColor?' selected':'');
    btn.style.background = col;
    btn.setAttribute('role','listitem');
    btn.setAttribute('aria-label', '色: '+col);
    btn.addEventListener('click', ()=>{ currentColor=col; document.getElementById('color-picker-input').value=col; updateCurrentColorDisplay(); renderPalette(); });
    btn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ currentColor=col; document.getElementById('color-picker-input').value=col; updateCurrentColorDisplay(); renderPalette(); } });
    palette.appendChild(btn);
  });
}

function updateCurrentColorDisplay() {
  document.getElementById('current-color-display').style.background = currentColor;
}

function updatePreview() {
  const previewCanvas = document.getElementById('anim-preview-canvas');
  const pc = previewCanvas.getContext('2d');
  pc.clearRect(0,0,64,64);
  const frame = frames[animTimer ? animFrameIdx % frames.length : currentFrame];
  pc.imageSmoothingEnabled = false;
  const scale = 64/gridSize;
  for (let y=0; y<gridSize; y++) {
    for (let x=0; x<gridSize; x++) {
      const col = frame[y*gridSize+x];
      if (col) {
        pc.fillStyle = uint32ToHex(col);
        pc.fillRect(Math.round(x*scale), Math.round(y*scale), Math.ceil(scale), Math.ceil(scale));
      }
    }
  }
}

// ---- Drawing ----
function getPixelCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  const x = Math.floor(((clientX - rect.left) * scaleX) / cellSize);
  const y = Math.floor(((clientY - rect.top) * scaleY) / cellSize);
  return { x, y };
}

function inBounds(x, y) { return x>=0 && y>=0 && x<gridSize && y<gridSize; }

function pushUndo() {
  undoStack.push(new Uint32Array(frames[currentFrame]));
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = [];
}

function paintPixel(frame, x, y, color) {
  if (!inBounds(x,y)) return;
  const c = color === 'transparent' ? 0 : colorToUint32(color);
  frame[y*gridSize+x] = c;
}

function floodFill(frame, startX, startY, fillColor) {
  const targetColor = frame[startY*gridSize+startX];
  const fillCol = fillColor === 'transparent' ? 0 : colorToUint32(fillColor);
  if (targetColor === fillCol) return;
  const stack = [[startX, startY]];
  while (stack.length) {
    const [x, y] = stack.pop();
    if (!inBounds(x,y)) continue;
    if (frame[y*gridSize+x] !== targetColor) continue;
    frame[y*gridSize+x] = fillCol;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
}

function getLinePixels(x0,y0,x1,y1) {
  const pts = [];
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let err=dx-dy;
  while(true) {
    pts.push([x0,y0]);
    if(x0===x1&&y0===y1) break;
    let e2=2*err;
    if(e2>-dy){err-=dy;x0+=sx;}
    if(e2<dx){err+=dx;y0+=sy;}
  }
  return pts;
}

function handleDrawStart(e) {
  e.preventDefault();
  const {x,y} = getPixelCoords(e);
  if (!inBounds(x,y)) return;
  if (currentTool==='eyedropper') {
    const col = frames[currentFrame][y*gridSize+x];
    currentColor = col ? uint32ToHex(col) : '#000000';
    document.getElementById('color-picker-input').value = currentColor === 'transparent' ? '#000000' : currentColor;
    updateCurrentColorDisplay();
    renderPalette();
    return;
  }
  if (currentTool==='fill') {
    pushUndo();
    floodFill(frames[currentFrame], x, y, currentColor);
    renderCanvas();
    renderFrameStrip();
    updatePreview();
    return;
  }
  if (currentTool==='line') {
    pushUndo();
    lineStart = {x, y};
    isDrawing = true;
    return;
  }
  pushUndo();
  isDrawing = true;
  const col = currentTool==='eraser' ? 'transparent' : currentColor;
  paintPixel(frames[currentFrame], x, y, col);
  renderCanvas();
  updatePreview();
}

function handleDrawMove(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const {x,y} = getPixelCoords(e);
  if (!inBounds(x,y)) return;
  if (currentTool==='line' && lineStart) {
    // show preview overlay
    const overlay = new Uint32Array(frames[currentFrame]);
    const pts = getLinePixels(lineStart.x, lineStart.y, x, y);
    const col = currentColor==='transparent'?0:colorToUint32(currentColor);
    pts.forEach(([px,py])=>{ if(inBounds(px,py)) overlay[py*gridSize+px]=col; });
    renderCanvas(overlay);
    return;
  }
  const col = currentTool==='eraser' ? 'transparent' : currentColor;
  paintPixel(frames[currentFrame], x, y, col);
  renderCanvas();
  updatePreview();
}

function handleDrawEnd(e) {
  if (!isDrawing) return;
  isDrawing = false;
  if (currentTool==='line' && lineStart) {
    const {x,y} = getPixelCoords(e.type==='touchend'?e.changedTouches[0]:e);
    const pts = getLinePixels(lineStart.x, lineStart.y, x, y);
    const col = currentColor==='transparent'?0:colorToUint32(currentColor);
    pts.forEach(([px,py])=>{ if(inBounds(px,py)) frames[currentFrame][py*gridSize+px]=col; });
    lineStart = null;
    renderCanvas();
    updatePreview();
  }
  renderFrameStrip();
}

canvas.addEventListener('mousedown', handleDrawStart);
canvas.addEventListener('mousemove', handleDrawMove);
canvas.addEventListener('mouseup', handleDrawEnd);
canvas.addEventListener('mouseleave', handleDrawEnd);
canvas.addEventListener('touchstart', handleDrawStart, {passive:false});
canvas.addEventListener('touchmove', handleDrawMove, {passive:false});
canvas.addEventListener('touchend', handleDrawEnd);

// ---- Tool selection ----
const TOOLS = ['pen','eraser','fill','eyedropper','line'];
TOOLS.forEach(t => {
  document.getElementById('tool-'+t).addEventListener('click', ()=>{
    currentTool = t;
    TOOLS.forEach(ot => {
      const btn = document.getElementById('tool-'+ot);
      btn.classList.toggle('active', ot===t);
      btn.setAttribute('aria-pressed', ot===t ? 'true' : 'false');
    });
    canvas.style.cursor = t==='eyedropper'?'crosshair':t==='fill'?'cell':'crosshair';
  });
});

// ---- Color picker ----
document.getElementById('color-picker-input').addEventListener('input', e => {
  currentColor = e.target.value;
  updateCurrentColorDisplay();
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.toggle('selected',s.style.background===currentColor));
});

// ---- Undo/Redo ----
document.getElementById('btn-undo').addEventListener('click', ()=>{
  if (undoStack.length===0) return;
  redoStack.push(new Uint32Array(frames[currentFrame]));
  frames[currentFrame] = undoStack.pop();
  renderCanvas();
  renderFrameStrip();
  updatePreview();
});
document.getElementById('btn-redo').addEventListener('click', ()=>{
  if (redoStack.length===0) return;
  undoStack.push(new Uint32Array(frames[currentFrame]));
  frames[currentFrame] = redoStack.pop();
  renderCanvas();
  renderFrameStrip();
  updatePreview();
});

// ---- Clear ----
document.getElementById('btn-clear').addEventListener('click', ()=>{
  if (confirm('現在のフレームをクリアしますか？')) {
    pushUndo();
    frames[currentFrame] = makeBlankFrame();
    renderCanvas();
    renderFrameStrip();
    updatePreview();
  }
});

// ---- Grid toggle ----
document.getElementById('btn-grid-toggle').addEventListener('click', ()=>{
  showGrid = !showGrid;
  document.getElementById('btn-grid-toggle').style.background = showGrid?'#4a5568':'#2d3748';
  renderCanvas();
});

// ---- Grid size ----
document.getElementById('grid-size-select').addEventListener('change', e=>{
  if (!confirm('グリッドサイズを変更すると現在の作業がクリアされます。続けますか？')) {
    e.target.value = gridSize;
    return;
  }
  gridSize = parseInt(e.target.value);
  frames = [makeBlankFrame()];
  currentFrame = 0;
  undoStack = [];
  redoStack = [];
  recalcCellSize();
  renderCanvas();
  renderFrameStrip();
  updatePreview();
});

// ---- Zoom ----
document.getElementById('zoom-select').addEventListener('change', ()=>{
  recalcCellSize();
  renderCanvas();
});

// ---- Frames ----
function selectFrame(i) {
  currentFrame = i;
  undoStack = [];
  redoStack = [];
  renderCanvas();
  renderFrameStrip();
  updatePreview();
}

document.getElementById('btn-add-frame').addEventListener('click', ()=>{
  frames.splice(currentFrame+1, 0, makeBlankFrame());
  currentFrame++;
  undoStack=[];redoStack=[];
  renderCanvas();
  renderFrameStrip();
  updatePreview();
});

document.getElementById('btn-del-frame').addEventListener('click', ()=>{
  if (frames.length<=1) { alert('フレームは最低1つ必要です'); return; }
  frames.splice(currentFrame,1);
  if (currentFrame>=frames.length) currentFrame=frames.length-1;
  undoStack=[];redoStack=[];
  renderCanvas();
  renderFrameStrip();
  updatePreview();
});

// ---- Animation ----
document.getElementById('fps-input').addEventListener('input', e=>{
  fps = parseInt(e.target.value);
  document.getElementById('fps-label').textContent = fps;
  if (animTimer) { clearInterval(animTimer); animTimer=setInterval(animStep, 1000/fps); }
});

function animStep() {
  animFrameIdx = (animFrameIdx+1) % frames.length;
  updatePreview();
  document.getElementById('anim-frame-label').textContent = 'フレーム '+(animFrameIdx+1)+'/'+frames.length;
}

document.getElementById('btn-play').addEventListener('click', ()=>{
  if (animTimer) clearInterval(animTimer);
  animFrameIdx = 0;
  animTimer = setInterval(animStep, 1000/fps);
});

document.getElementById('btn-stop').addEventListener('click', ()=>{
  if (animTimer) { clearInterval(animTimer); animTimer=null; }
  updatePreview();
  document.getElementById('anim-frame-label').textContent = 'フレーム '+(currentFrame+1)+'/'+frames.length;
});

// ---- Save/Load ----
function serializeProject() {
  return {
    gridSize,
    frames: frames.map(f => Array.from(f)),
  };
}

function deserializeProject(data) {
  gridSize = data.gridSize || 16;
  frames = data.frames.map(f => new Uint32Array(f));
  currentFrame = 0;
  undoStack=[];redoStack=[];
  document.getElementById('grid-size-select').value = gridSize;
  recalcCellSize();
  renderCanvas();
  renderFrameStrip();
  updatePreview();
}

document.getElementById('btn-save').addEventListener('click', ()=>{
  const slot = document.getElementById('slot-select').value;
  const key = 'pixelart_slot_'+slot;
  localStorage.setItem(key, JSON.stringify(serializeProject()));
  document.getElementById('slot-status').textContent = 'スロット'+(parseInt(slot)+1)+'に保存しました';
});

document.getElementById('btn-load').addEventListener('click', ()=>{
  const slot = document.getElementById('slot-select').value;
  const key = 'pixelart_slot_'+slot;
  const data = localStorage.getItem(key);
  if (!data) { document.getElementById('slot-status').textContent = 'データがありません'; return; }
  if (confirm('スロット'+(parseInt(slot)+1)+'から読み込みますか？（現在の作業は失われます）')) {
    deserializeProject(JSON.parse(data));
    document.getElementById('slot-status').textContent = 'スロット'+(parseInt(slot)+1)+'から読み込みました';
  }
});

// ---- Export PNG ----
document.getElementById('btn-export-png').addEventListener('click', ()=>{
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = gridSize;
  exportCanvas.height = gridSize;
  const ec = exportCanvas.getContext('2d');
  ec.clearRect(0,0,gridSize,gridSize);
  const frame = frames[currentFrame];
  for (let y=0;y<gridSize;y++) {
    for (let x=0;x<gridSize;x++) {
      const col = frame[y*gridSize+x];
      if (col) {
        ec.fillStyle = uint32ToHex(col);
        ec.fillRect(x,y,1,1);
      }
    }
  }
  const a = document.createElement('a');
  a.href = exportCanvas.toDataURL('image/png');
  a.download = 'pixel-art-frame'+(currentFrame+1)+'.png';
  a.click();
});

// ---- Keyboard shortcuts ----
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if (e.ctrlKey && e.key==='z') { document.getElementById('btn-undo').click(); }
  else if (e.ctrlKey && e.key==='y') { document.getElementById('btn-redo').click(); }
  else if (e.key==='p' || e.key==='P') { document.getElementById('tool-pen').click(); }
  else if (e.key==='e' || e.key==='E') { document.getElementById('tool-eraser').click(); }
  else if (e.key==='f' || e.key==='F') { document.getElementById('tool-fill').click(); }
  else if (e.key==='i' || e.key==='I') { document.getElementById('tool-eyedropper').click(); }
  else if (e.key==='l' || e.key==='L') { document.getElementById('tool-line').click(); }
});

// ---- Init ----
initApp();
</script>
</body>
</html>
